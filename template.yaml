AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ironbear.dev - static website hosted on CloudFront

# CloudFront only accepts ACM certificates from us-east-1, and the certificate lives in the
# nested stack, so this whole stack must be deployed there.
Rules:
  RequireUsEast1:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Deploy this stack to us-east-1 (required for CloudFront certificates).

Parameters:
  # The same constraints are repeated in infrastructure/cloudfront.yaml. Checking them here too
  # makes a bad value fail when the changeset is created, not halfway through the nested stack.
  DomainName:
    Type: String
    Description: Apex domain served by the site. www.<DomainName> is added automatically.
    AllowedPattern: ^([a-z0-9-]+\.)+[a-z]{2,}$
  HostedZoneId:
    Type: String
    Description: ID of the existing Route53 public hosted zone for DomainName.
    AllowedPattern: ^Z[A-Z0-9]+$
  WebsiteBucketName:
    Type: String
    Description: >-
      Globally unique name of the private S3 bucket that holds the built site. Lowercase letters,
      digits, and dashes only (3-60 chars). No dots.
    AllowedPattern: ^[a-z0-9][a-z0-9-]{1,58}[a-z0-9]$
    ConstraintDescription: Use 3-60 lowercase letters, digits, or dashes, with no dots (e.g. ironbear-prd-website).

Resources:
  CloudFrontStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infrastructure/cloudfront.yaml
      Parameters:
        DomainName: !Ref DomainName
        HostedZoneId: !Ref HostedZoneId
        WebsiteBucketName: !Ref WebsiteBucketName

Outputs:
  WebsiteBucketName:
    Description: Bucket the built site is synced into (read by scripts/deploy-website.mjs)
    Value: !GetAtt CloudFrontStack.Outputs.WebsiteBucketName
  DistributionId:
    Description: Distribution invalidated after a site deploy (read by scripts/deploy-website.mjs)
    Value: !GetAtt CloudFrontStack.Outputs.DistributionId
  DistributionDomainName:
    Description: The distribution's own *.cloudfront.net domain
    Value: !GetAtt CloudFrontStack.Outputs.DistributionDomainName
